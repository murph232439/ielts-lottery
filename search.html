var PART='all',KW='',MODE='browse',CUR=null,CURNODE=null;
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})}
function hl(s){s=esc(s);if(!KW)return s;try{return s.replace(new RegExp('('+KW.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')}catch(e){return s}}
function stop(){if(CUR){try{CUR.pause()}catch(e){}CUR=null}if(CURNODE){CURNODE.className=CURNODE.dataset.cls||'play';CURNODE.textContent=CURNODE.dataset.txt||'▶';CURNODE=null}}
function play(btn,url){
  if(!url)return;
  if(CURNODE===btn){stop();return}
  stop();
  CUR=new Audio(url);CURNODE=btn||null;
  if(btn){btn.dataset.cls=btn.className;btn.dataset.txt=btn.textContent;btn.className='play on';btn.textContent='❚❚'}
  CUR.onended=CUR.onerror=function(){if(btn){btn.className=btn.dataset.cls||'play';btn.textContent=btn.dataset.txt||'▶'}CUR=null;CURNODE=null};

}

function renderBrowse(){
  var out='',shown=0,lastcat='',kw=KW.toLowerCase();
  G.forEach(function(g){
    if(PART!=='all'&&g.part!==PART)return;
    var lines=g.lines||[];
    var titleHit=!kw||(g.title+' '+g.cat).toLowerCase().indexOf(kw)>=0;
    var hitLines=lines.filter(function(l){return !kw||titleHit||l.t.toLowerCase().indexOf(kw)>=0});
    var cueHit=!kw||titleHit||(g.cue||'').toLowerCase().indexOf(kw)>=0;
    if(kw&&!titleHit&&hitLines.length===0&&!cueHit)return;
    if(g.cat!==lastcat){lastcat=g.cat;out+='<div class="cat">'+esc(g.cat)+'</div>'}
    shown++;
    var badge=(g.tags&&g.tags.length)?'<span class="badge">'+esc(g.tags.join('/'))+'</span>':'';
    out+='<div class="card"><div class="ptitle">'+hl(g.title)+badge+'</div>';

      if(g.cue)out+='<div class="cue">'+hl(g.cue)+'</div>';
      if(g.a)out+='<div class="qrow"><div class="qtxt" style="color:#98a0ae;font-size:13px">朗读整段 cue card</div><button class="play" data-a="'+esc(g.a)+'">▶</button></div>';
    }else{
      var show=(kw&&!titleHit)?hitLines:lines;
      show.forEach(function(l){out+='<div class="qrow"><div class="qtxt">'+hl(l.t)+'</div>'+(l.a?'<button class="play" data-a="'+esc(l.a)+'">▶</button>':'')+'</div>'});
    }

  });

  document.getElementById('pcnt').textContent=gs.length+' 个话题 · 选择一组开始';
  PG=null;
}
function startGroup(gi){
  PG=practiceGroups()[gi];
  PITEM=shuffle(PG.lines.filter(function(l){return l.a}));
  if(PITEM.length<2){PITEM=shuffle(PG.lines)}
  PIDX=0;PSCORE=0;
  renderQ();
}
function renderQ(){
  stop();
  if(PIDX>=PITEM.length){renderDone();return}
  PCUR=PITEM[PIDX];PLOCK=false;
  POPTS=shuffle(PG.lines);
  var o='<div class="phead"><div class="pmeta">'+esc(PG.cat)+' · '+esc(PG.title)+'</div><div class="pscore">第 <span>'+(PIDX+1)+'</span> / '+PITEM.length+' 题　得分 <span>'+PSCORE+'</span></div></div>';
  o+='<div class="card"><button class="bigplay" id="replay">🔊 再听一遍</button><div class="phint">听完后，选出这句话对应的问题</div><div class="opts" id="opts">';
  POPTS.forEach(function(l,i){o+='<button class="opt" data-i="'+i+'">'+esc(l.t)+'</button>'});
  o+='</div><div class="fb" id="fb"></div><button class="nextbtn" id="next" style="display:none">下一题 →</button></div>';
  document.getElementById('list').innerHTML=o;
  var rp=document.getElementById('replay');
  if(PCUR.a)play(rp,PCUR.a);
}
function choose(btn){
  if(PLOCK)return;PLOCK=true;
  stop();
  var pickT=btn.textContent;
  var correct=(pickT===PCUR.t);
  var opts=document.querySelectorAll('.opt');
  opts.forEach(function(b){b.disabled=true;if(b.textContent===PCUR.t)b.className='opt right'});
  if(!correct)btn.className='opt wrong';
  var fb=document.getElementById('fb');
  if(correct){PSCORE++;fb.className='fb ok';fb.textContent='✓ 答对了'}
  else{fb.className='fb no';fb.textContent='✗ 正确答案是绿色那一句'}
  document.querySelector('.pscore').innerHTML='第 <span>'+(PIDX+1)+'</span> / '+PITEM.length+' 题　得分 <span>'+PSCORE+'</span>';
  var nx=document.getElementById('next');
  nx.style.display='block';
  nx.textContent=(PIDX+1>=PITEM.length)?'看结果 →':'下一题 →';
}
function nextQ(){PIDX++;renderQ()}
function renderDone(){
  stop();
  var pct=Math.round(PSCORE/PITEM.length*100);
  var word=pct>=90?'非常棒':pct>=70?'不错':pct>=50?'继续加油':'再听几遍会更好';
  var o='<div class="done"><div class="pmeta">'+esc(PG.title)+'</div><div class="big">'+PSCORE+' / '+PITEM.length+'</div><div class="sub">'+word+'</div>';
  o+='<button class="p1b" id="again">再练这一组</button><button class="p2b" id="back">换一个话题</button></div>';
  document.getElementById('list').innerHTML=o;
}
/* ---------- 事件 ---------- */
document.getElementById('mode').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;
  MODE=e.target.dataset.m;
  document.getElementById('mode').querySelectorAll('button').forEach(function(b){b.className=(b.dataset.m===MODE?'on':'')});
  document.getElementById('browseBar').style.display=(MODE==='browse'?'':'none');
  document.getElementById('practiceBar').style.display=(MODE==='practice'?'':'none');
  stop();
  if(MODE==='browse')renderBrowse();else renderPracticeList();
};
document.getElementById('q').oninput=function(){KW=this.value.trim();renderBrowse()};
document.getElementById('tabs').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;
  PART=e.target.dataset.p;
  document.getElementById('tabs').querySelectorAll('button').forEach(function(b){b.className=(b.dataset.p===PART?'on':'')});
  renderBrowse();
};
document.getElementById('ptabs').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;
  PTAB=e.target.dataset.p;
  document.getElementById('ptabs').querySelectorAll('button').forEach(function(b){b.className=(b.dataset.p===PTAB?'on':'')});
  renderPracticeList();
};
document.getElementById('list').onclick=function(e){
  var t=e.target;
  var pb=t.closest?t.closest('.play'):null;
  if(pb){play(pb,pb.dataset.a);return}
  if(MODE==='practice'){
    if(!PG){
      var gc=t.closest?t.closest('.gcard'):null;
      if(gc){startGroup(+gc.dataset.i);return}
    }
    if(t.classList&&t.classList.contains('opt')){choose(t);return}
    if(t.id==='replay'){play(t,PCUR.a);return}
    if(t.id==='next'){nextQ();return}
    if(t.id==='again'){PIDX=0;PSCORE=0;renderQ();return}
    if(t.id==='back'){renderPracticeList();return}
  }
};
renderBrowse();
</script></body></html>
