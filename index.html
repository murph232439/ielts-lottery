var T='p1',FB='all',QS=[],CUR=null,CURL='';
function setTip(s){var t=document.getElementById('atip');if(t)t.textContent=s}
function playAud(url){if(!url){setTip('该题暂无音频');return}CURL=url;try{if(CUR)CUR.pause()}catch(e){}try{CUR=new Audio(url);CUR.preload='auto';CUR.onplaying=function(){setTip('播放中…')};CUR.onended=function(){setTip('播放完毕，点「显示题目」看文字')};CUR.onerror=function(){setTip('音频加载失败，请检查网络')};setTip('加载中…');var p=CUR.play();if(p&&p.catch)p.catch(function(){setTip('点「再听一遍」播放音频')})}catch(e){setTip('播放出错：'+e.name)}}
function isNew(q){return (q.tags||[]).indexOf('新题')>=0}
function keep(q){return FB=='all'||(FB=='new'?isNew(q):!isNew(q))}
function init(t){
T=t;
document.getElementById('tb').querySelectorAll('button').forEach(function(b){b.className=(b.dataset.t==t?'on':'')});
document.getElementById('card').innerHTML='<div class=pl id=pl>🎴<br><span style=font-size:13px>点下方按钮抽题</span></div>';
if(t=='p1'){QS=[];P1.forEach(function(x){x.questions.forEach(function(q,i){QS.push({cat:x.category,t:q,tags:x.tags,a:(x.audios||[])[i]||''})})})}
else if(t=='p2'){QS=P2.slice()}
else if(t=='p3'){QS=[];P2.forEach(function(x){(x.p3||[]).forEach(function(q,i){QS.push({cat:x.category,t:q,t2:x.title,tags:x.tags,a:(x.p3audios||[])[i]||''})})})}
QS=QS.filter(keep);
var c=QS.length,lb=FB=='new'?'新题 ':FB=='old'?'旧题 ':'';
document.getElementById('inf').textContent=(t=='p1'?'Part 1 - ':t=='p2'?'Part 2 - ':'Part 3 - ')+lb+c+(t=='p2'?' 题':' 问');
}
function pick(){
document.getElementById('btn').disabled=true;
document.getElementById('btn').textContent='✦ 抽题中';
setTimeout(function(){
var f=QS[Math.floor(Math.random()*QS.length)];
var html='';
if(T=='p1'){if(f.a){html='<span class=cat>'+f.cat+'</span><div class=listen>🔊 请听题</div><div class=abtns><button class=ab id=rep>▶️ 播放题目</button><button class=ab id=rev>👀 显示题目</button></div><div class=ti id=qtx style=display:none>'+f.t+'</div><div class=hint id=atip>点「播放题目」听音频</div>'}else{html='<span class=cat>'+f.cat+'</span><div class=hint>该题暂无音频</div><div class=ti>'+f.t+'</div>'}}
else if(T=='p2'){html='<span class=cat>'+f.category+'</span><span class=t>'+(f.tags||[]).join('/')+'</span><div class=ti>'+f.title+'</div><div class=cu>'+(f.cue||'')+'</div>'}
else if(T=='p3'){if(f.a){html='<span class=cat>'+f.cat+'</span><span class=t>'+f.t2+'</span><div class=listen>🔊 请听题</div><div class=abtns><button class=ab id=rep>▶️ 播放题目</button><button class=ab id=rev>👀 显示题目</button></div><div class=ti id=qtx style=display:none>'+f.t+'</div><div class=hint id=atip>点「播放题目」听音频</div>'}else{html='<span class=cat>'+f.cat+'</span><span class=t>'+f.t2+'</span><div class=hint>该题暂无音频</div><div class=ti>'+f.t+'</div>'}}
document.getElementById('card').innerHTML=html;
if((T=='p1'||T=='p3')&&f.a){CURL=f.a;setTip('点「播放题目」听音频')}
document.getElementById('btn').disabled=false;
document.getElementById('btn').textContent='🎲 再抽一次';
},300);
}
document.getElementById('tb').onclick=function(e){if(e.target.tagName=='BUTTON')init(e.target.dataset.t)};
document.getElementById('card').onclick=function(e){var id=e.target&&e.target.id;if(id=='rep'){playAud(CURL)}if(id=='rev'){var q=document.getElementById('qtx');if(q)q.style.display='block';}};
document.getElementById('fb').onclick=function(e){if(e.target.tagName=='BUTTON'){FB=e.target.dataset.f;document.getElementById('fb').querySelectorAll('button').forEach(function(b){b.className=(b.dataset.f==FB?'on':'')});init(T)}};
document.getElementById('btn').onclick=pick;
init('p1');
</script></body></html>
